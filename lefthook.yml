# Refer for explanation to following link:
# https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md

pre-commit:
  parallel: false
  commands:
    oxfmt:
      glob: "*.{js,ts,cjs,mjs,jsx,tsx,json,jsonc}"
      run: npx oxfmt --check {staged_files}
    oxlint:
      glob: "*.{js,ts,cjs,mjs,jsx,tsx}"
      run: npx oxlint --type-aware --type-check {staged_files}
