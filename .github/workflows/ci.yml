name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: (oxc) Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.7.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (oxfmt)
        run: npm run format:check

  build:
    name: Website Build and Test Full Repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.7.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
      - name: Build
        working-directory: packages/hono-typebox-openapi
        run: npm run build
      # Type-aware lint resolves `hono-typebox-openapi` via its dist/ type
      # declarations, so it must run after the build above.
      #
      # Do not scope to changed files. Previously, if we didn't lint everything,
      # some bugs would slip through due to the sheer nature of git diff.
      - name: Lint (oxlint, type-aware + type-check)
        run: npm run lint
      - name: Test
        run: npm run test

  codegen-integration:
    name: Client codegen (swift-openapi-generator + Ktor/Kotlin)
    # Swift runs on Linux, so no macOS runner is needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.7.0"
          cache: "npm"
      # JDK 17 (LTS): openapi-generator's kotlin template emits a Gradle 7.x wrapper that does
      # not support very new JDKs. setup-java sets JAVA_HOME, which the ktor test uses for the
      # Gradle build (see apps/codegen-integration/src/ktor.test.ts compatibleJavaHome()).
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          # >= 6.1: swift-openapi-runtime 1.12.0 declares swift-tools-version 6.1, so an older
          # toolchain cannot even read its manifest ("incompatible tools version").
          swift-version: "6.1"

      - name: Install dependencies
        run: npm ci
      - name: Build library
        working-directory: packages/hono-typebox-openapi
        run: npm run build

      - name: Start example API server
        working-directory: apps/internal-api
        run: |
          PORT=34100 npm run start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:34100/openapi >/dev/null && exit 0
            sleep 1
          done
          echo "example server did not become ready" >&2
          exit 1

      - name: Run codegen integration tests
        # Only the local example server (34100) is reachable in CI; the private BestFit source
        # (:3001) is never present here, so those cases skip automatically.
        run: npx vitest run --config .config/vitest.config.mts apps/codegen-integration
